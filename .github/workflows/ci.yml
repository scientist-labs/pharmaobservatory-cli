name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by regenerate.yml on the regeneration PR's head SHA (see that file's header).
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty means the triggering commit.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: generated tree is current
        # git status also catches a generated file that is new and untracked, which git diff misses.
        run: go generate ./... && git diff --exit-code && test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: codename guard
        run: bin/check-no-codename

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # No credentials: signing is skipped and publishing is disabled in a snapshot.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=sign
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
