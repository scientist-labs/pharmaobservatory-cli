# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: pharmaobservatory

before:
  hooks:
    - go mod tidy

builds:
  - id: po
    main: ./cmd/po
    binary: po
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/cmd.version={{.Version}}
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/cmd.commit={{.Commit}}
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/cmd.date={{.Date}}

archives:
  - id: po
    name_template: "po_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Cosign keyless signing (GitHub OIDC). Gated to tagged releases: the snapshot
# dry run passes --skip=sign, so no credentials are needed. Needs `cosign` on
# PATH and `id-token: write` in the release workflow (ticket #8).
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    output: true

nfpms:
  - id: packages
    package_name: pharmaobservatory
    file_name_template: "pharmaobservatory_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids: [po]
    vendor: Scientist.com
    homepage: https://pharmaobservatory.com
    maintainer: Pharma Observatory <support@scientist.com>
    description: Pharma Observatory command line client
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

# Homebrew formula named pharmaobservatory (installs the po binary), written to
# the tap repo. Skipped unless TAP_GITHUB_TOKEN is set, so a snapshot or
# credential-less run never touches the tap. Real publishing is ticket #8.
brews:
  - name: pharmaobservatory
    ids: [po]
    homepage: https://pharmaobservatory.com
    description: Pharma Observatory command line client
    license: MIT
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: scientist-labs
      name: homebrew-pharmaobservatory
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    test: |
      system "#{bin}/po", "version"

release:
  # A snapshot never publishes (GoReleaser skips publish in snapshot mode);
  # tagged releases are driven by ticket #8.
  draft: true

changelog:
  disable: true
