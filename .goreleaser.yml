# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: pharmaobservatory

# THE EXECUTABLE NAME IS SET HERE (epic #4931 has not settled it; `po` for now). Archives, the build
# output, the deb/rpm /usr/bin entry, the brew test and install, and, through the apierr.Bin ldflag
# below, the root command, `version`, help and error text and the User-Agent all read BINARY_NAME. To
# rename the executable change the next line. The module path, the cmd/po directory, the PO_*
# environment variables, the config directory and the keychain service name are literals NOT derived
# from it: see packaging/README.md for the full rename list.
env:
  - BINARY_NAME=po

before:
  hooks:
    - go mod tidy

builds:
  - id: cli
    main: ./cmd/po
    binary: "{{ .Env.BINARY_NAME }}"
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/cmd.version={{.Version}}
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/cmd.commit={{.Commit}}
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/cmd.date={{.Date}}
      - -X github.com/scientist-labs/pharmaobservatory-cli/internal/apierr.Bin={{ .Env.BINARY_NAME }}

archives:
  - id: cli
    ids: [cli]
    name_template: "{{ .Env.BINARY_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Cosign keyless signing (GitHub OIDC): one .sigstore.json bundle (signature plus certificate) per
# signed file, for checksums.txt and for every archive. The snapshot dry run passes --skip=sign, so
# no credentials are needed. Needs `cosign` on PATH and `id-token: write` in the release job only.
# Verification command: packaging/README.md.
signs:
  - id: cosign-checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true
  - id: cosign-archives
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# deb and rpm. The package name is the project name (pharmaobservatory); the executable inside is
# BINARY_NAME. The archive keyring ships in both so an upgrade carries a rotated key (design note,
# issue #1).
nfpms:
  - id: packages
    package_name: pharmaobservatory
    file_name_template: "pharmaobservatory_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids: [cli]
    vendor: Scientist.com
    homepage: https://pharmaobservatory.com
    maintainer: Pharma Observatory <support@scientist.com>
    description: Pharma Observatory command line client
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/pharmaobservatory-archive-keyring.gpg
        dst: /usr/share/keyrings/pharmaobservatory-archive-keyring.gpg
        packager: deb
      - src: packaging/pharmaobservatory-archive-keyring.asc
        dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-pharmaobservatory
        packager: rpm

# Homebrew FORMULA named pharmaobservatory, pushed to the tap over SSH with the TAP_DEPLOY_KEY deploy
# key. `brews` is soft-deprecated since GoReleaser v2.10 in favour of `homebrew_casks`, kept on
# purpose: a formula installs on macOS and Linux with `brew install`, a cask is the macOS-oriented
# replacement and would change the install command and drop the Linuxbrew path the issue requires.
# Revisit when `brews` is removed in a GoReleaser major. Upload is skipped unless TAP_DEPLOY_KEY is
# set, so a snapshot or credential-less run never touches the tap; the release workflow sets it.
brews:
  - name: pharmaobservatory
    ids: [cli]
    homepage: https://pharmaobservatory.com
    description: Command-line client for the biomedical data platform
    license: MIT
    skip_upload: '{{ if index .Env "TAP_DEPLOY_KEY" }}false{{ else }}true{{ end }}'
    repository:
      owner: scientist-labs
      name: homebrew-pharmaobservatory
      branch: main
      git:
        url: git@github.com:scientist-labs/homebrew-pharmaobservatory.git
        # Pinned host keys, installed by release.yml from packaging/github_known_hosts.
        ssh_command: ssh -i {{ .KeyPath }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pharmaobservatory_known_hosts -F /dev/null
        private_key: '{{ index .Env "TAP_DEPLOY_KEY" }}'
    commit_author:
      name: pharmaobservatory-release
      email: noreply@github.com
    test: |
      system "#{bin}/{{ .Env.BINARY_NAME }}", "version"

release:
  # Published, not a draft: regenerate.yml tags a patch release unattended. A pre-release tag
  # (v1.2.3-rc1) is marked as one.
  prerelease: auto

# Release notes from the merged PR titles since the previous tag.
changelog:
  use: github
  sort: asc
